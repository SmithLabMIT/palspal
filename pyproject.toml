[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "palspal"
version = "1.0.0"
description = "Python wrapper for analyses in PALSfit3"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Brandon C. Tapia"},
  { name = "Zachary P. Smith", email = "smithlab_software@gmit.edu" }
]

dependencies = []

keywords = []

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics"]


[project.optional-dependencies]
dev = ["pytest", "black", "build", "twine"]
docs = ["sphinx", "sphinxcontrib-bibtex", "sphinx_copybutton",]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."
]
[tool.black]
target-version = ["py312"]
line-length = 100
skip-magic-trailing-comma = true
